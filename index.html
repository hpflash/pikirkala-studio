<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101b2a" />
  <meta name="description" content="PIKIRKALA STUDIO — workspace produksi visual dokumenter." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>PIKIRKALA STUDIO</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="PIKIRKALA STUDIO">
        <span class="brand-mark">P</span><span><strong>PIKIRKALA</strong><small>STUDIO</small></span>
      </a>
      <nav class="nav-list">
        <button class="nav-item active" data-view="dashboard"><span>⌂</span> Dashboard</button>
        <button class="nav-item" data-view="projects"><span>▤</span> Proyek</button>
        <button class="nav-item" data-view="workspace"><span>◈</span> Produksi adegan</button>
        <button class="nav-item" data-view="batches"><span>▦</span> Batch Flow</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="local-status"><i></i><span>Tersimpan di perangkat</span></div>
        <button class="nav-item" data-view="help"><span>?</span> Panduan</button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Buka menu">☰</button>
        <div class="crumb" id="breadcrumb">Workspace <span>/</span> Dashboard</div>
        <div class="top-actions"><span class="local-pill"><i></i> Lokal</span><button class="btn btn-primary btn-sm" id="topNewProject">＋ Proyek baru</button></div>
      </header>
      <div class="content" id="appContent"></div>
      <footer class="footer">PIKIRKALA STUDIO <span>•</span> Versi 1.0 <span>•</span> Data disimpan di browser perangkat ini</footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden />
  <script src="app.js"></script>
</body>
</html>
